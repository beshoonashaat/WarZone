<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الفرق | War Zone</title>
  <style>
    :root{--bg:#07111f;--card:#101d33;--card2:#14233d;--line:#263955;--text:#f8fafc;--muted:#94a3b8;--cyan:#38bdf8;--green:#34d399;--red:#fb7185}
    *{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',Tahoma,sans-serif;background:radial-gradient(circle at top right,#12345c 0,#07111f 38%,#050b16 100%);color:var(--text);min-height:100vh;padding:22px}.wrap{max-width:1300px;margin:0 auto}.hero{text-align:center;margin:10px 0 24px}.hero h1{color:var(--cyan);margin:0;font-size:2.2rem}.hero p{color:var(--muted);line-height:1.8}.top{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}a.btn{border-radius:12px;padding:11px 18px;background:#1f2e46;color:white;text-decoration:none;font-weight:800}.teams{display:grid;gap:20px}.team{background:rgba(16,29,51,.9);border:1px solid rgba(148,163,184,.2);border-radius:22px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.team-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.team h2{margin:0;color:var(--cyan)}.count{color:var(--green);font-weight:900}.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.player{background:#0b1628;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid rgba(56,189,248,.45);background:#14233d;margin-bottom:10px}.placeholder{width:92px;height:92px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#14233d;border:3px solid rgba(148,163,184,.25);font-size:2rem;margin-bottom:10px}.name{font-weight:900;margin-bottom:6px}.meta{color:var(--muted);font-size:.86rem;line-height:1.7}.status{text-align:center;color:var(--muted);padding:40px}.search{max-width:520px;margin:0 auto 20px}input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:#0b1628;color:var(--text);font-size:1rem}@media(max-width:650px){body{padding:12px}.players{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:1.8rem}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>فرق War Zone</h1><p>كل الفرق المسجلة واللاعبين داخل كل فريق</p></div>
  <div class="top"><a class="btn" href="/">الرئيسية</a><a class="btn" href="/register">تسجيل فريق</a></div>
  <div class="search"><input id="search" placeholder="ابحث باسم الفريق أو اللاعب..." oninput="render()"></div>
  <div id="content" class="status">جاري تحميل الفرق...</div>
</div>
<script>
let teams=[];
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const filtered=teams.filter(t=>(t.team_name||'').toLowerCase().includes(q)||(t.players||[]).some(p=>(p.name||'').toLowerCase().includes(q)));
  const el=document.getElementById('content');
  if(!filtered.length){el.className='status';el.textContent='لا توجد فرق مطابقة.';return;}
  el.className='teams';
  el.innerHTML=filtered.map(t=>`<section class="team"><div class="team-head"><h2>${esc(t.team_name)}</h2><div class="count">${t.players_count||0} لاعب</div></div><div class="players">${(t.players||[]).map(p=>`<div class="player">${p.photo_url?`<img class="avatar" src="${esc(p.photo_url)}" alt="${esc(p.name)}">`:`<div class="placeholder">👤</div>`}<div class="name">${esc(p.name)}</div><div class="meta">${esc(p.gender||'')}<br>${esc(p.university||'')} ${p.college?' - '+esc(p.college):''}</div></div>`).join('')}</div></section>`).join('');
}
async function load(){try{const r=await fetch('/api/public-teams');if(!r.ok)throw new Error('فشل تحميل الفرق');const d=await r.json();teams=d.teams||[];render();}catch(e){document.getElementById('content').textContent=e.message;}}
load();
</script>
</body>
</html>
