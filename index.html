<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War Zone Standings</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #0284c7;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --text: #0f172a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .sports-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .sport-card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .sport-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .sport-card.active {
            border-color: var(--accent);
            background-color: #fef3c7;
            color: #b45309;
        }

        .standings-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .group-title {
            color: var(--primary);
            border-right: 4px solid var(--accent);
            padding-right: 10px;
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 1rem;
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: var(--primary);
            color: white;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .rank {
            font-weight: bold;
            width: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>War Zone Standings 🏆</h1>
    </header>

    <div style="text-align: center; margin-bottom: 20px;">
    <button onclick="showSection('standings')" class="nav-btn">📊 جداول الترتيب</button>
    <button onclick="showSection('day1')" class="nav-btn">📅 مباريات اليوم 1</button>
    <button onclick="showSection('day2')" class="nav-btn">📅 مباريات اليوم 2</button>
    </div>

    <!-- أزرار الألعاب الأربعة -->
    <div class="sports-container">
        <div class="sport-card active" onclick="loadStandings('Football', this)">⚽ Football</div>
        <div class="sport-card" onclick="loadStandings('Dodgeball', this)">🎯 Dodgeball</div>
        <div class="sport-card" onclick="loadStandings('Volleyball', this)">🏐 Volleyball</div>
        <div class="sport-card" onclick="loadStandings('Ultimate Ball', this)">🥏 Ultimate Ball</div>
    </div>

    <!-- مكان عرض المجموعات والجدول -->
    <div class="standings-section">
        <h2 id="current-sport-title">جدول ترتيب: Football</h2>
        <div id="groups-container">
            <!-- سيتم تحميل الجداول هنا تلقائياً عبر الجافا سكريبت -->
        </div>
    </div>

    <script>
        // دالة وهمية لمحاكاة البيانات القادمة من الباك إند (FastAPI)
        // في الواقع، ستستخدم fetch('/standings?sport=' + sportName)
        async function loadStandings(sportName, element) {
            // تغيير الشكل النشط للزر
            document.querySelectorAll('.sport-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
            
            // تغيير عنوان اللعبة الحالية
            document.getElementById('current-sport-title').innerText = "جدول ترتيب: " + sportName;

            const container = document.getElementById('groups-container');
            container.innerHTML = "جاري تحميل البيانات...";

            try {
                // اطلب البيانات من البايثون باك إند
                const response = await fetch(`/standings/${sportName}`);
                const groups = await response.json();
                
                container.innerHTML = ""; // مسح نص التحميل

                // بناء الجداول لكل مجموعة
                for (const groupName in groups) {
                    let groupHtml = `
                        <h3 class="group-title">المجموعة ${groupName}</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th class="rank">المركز</th>
                                    <th>الفريق</th>
                                    <th>لعب</th>
                                    <th>فوز</th>
                                    <th>تعادل</th>
                                    <th>خسارة</th>
                                    <th>النقاط</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    groups[groupName].forEach((team, index) => {
                        groupHtml += `
                            <tr>
                                <td class="rank">${index + 1}</td>
                                <td><strong>${team.الفريق || team.Team || team.team || "بدون اسم"}</strong></td>
                                <td>${team.لعب || 0}</td>
                                <td>${team.فوز || 0}</td>
                                <td>${team.تعادل || 0}</td>
                                <td>${team.خسارة || 0}</td>
                                <td style="color: var(--secondary); font-weight:bold;">${team.نقاط}</td>
                            </tr>
                        `;
                    });

                    groupHtml += `</tbody></table>`;
                    container.innerHTML += groupHtml;
                }
            } catch (error) {
                container.innerHTML = "<p style='color:red;'>لم يتم رفع ملف الإكسيل الخاص بهذه اللعبة بعد.</p>";
            }
        }

        // تحميل اللعبة الأولى تلقائياً عند فتح الصفحة
        window.onload = function() {
            loadStandings('Football', document.querySelector('.sport-card'));
        };

        async function loadMatches(day) {
        document.getElementById('view-title').innerText = "مباريات: " + (day === 'Day1' ? 'اليوم الأول' : 'اليوم الثاني');
        const container = document.getElementById('main-content');
        container.innerHTML = "جاري التحميل...";
        
        try {
            const res = await fetch(`/matches/${day}`);
            const matches = await res.json();
            
            let html = '<div class="matches-list">';
            
            matches.forEach(m => {
                html += `
                    <div class="match-card">
                        <div class="match-time">${m.الوقت || '--:--'}</div>
                        
                        <div class="match-info">
                            <span class="match-sport-tag">${m.اللعبة || 'اللعبة'}</span>
                            <div class="match-teams">
                                <span>${m["الفريق الأول"] || 'فريق 1'}</span>
                                <span class="match-score">${m.النتيجة || 'VS'}</span>
                                <span>${m["الفريق الثاني"] || 'فريق 2'}</span>
                            </div>
                        </div>
                        
                        <div class="match-status">${m.الحالة || ''}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html + "</div>";
        } catch (e) {
            container.innerHTML = "خطأ في تحميل البيانات.";
        }
    }
    </script>
</body>
</html>
